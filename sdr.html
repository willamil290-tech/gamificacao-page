<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamificação - Devalor</title>
    <link rel="icon" href="Devalor.jpeg" type="">
    <link rel="stylesheet" href="comercial.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="logodev.png" alt="Logotipo da Empresa" class="logo">
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>            
                    <li><a href="regrasdr.html">Regras SDR</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="ranking">
            <h2>Ranking de SDR</h2>
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Vendedor</th>
                        <th>Pontos</th>
                    </tr>
                </thead>
                <tbody id="tabela-ranking"></tbody>
            </table>
        </section>

        
        <section id="lancamento">
            <h2>Lançamento de números</h2>
            <p class="sub">Digite os números abaixo. Os pontos são calculados automaticamente e ficam salvos localmente (neste navegador).</p>

            <div class="controls">
                <div class="left">
                    <button class="btn danger" id="resetar-dados" type="button">Zerar</button>
                    <button class="btn" id="exportar-json" type="button">Exportar</button>
                    <label class="btn" for="importar-json">Importar</label>
                    <input id="importar-json" type="file" accept="application/json" style="display:none;">
                </div>
                <span class="badge" id="status-salvamento"></span>
            </div>

            <div class="table-wrap">
                <table id="tabela-lancamento" aria-label="Tabela de lançamento de números e pontos"></table>
            </div>

            <details class="formula">
                <summary>Como calculamos os pontos</summary>
                <ul id="lista-formula"></ul>
            </details>
        </section>

<section id="destaque-do-mes">
            <h2>Destaques do Mês ⭐</h2>
            <div id="vendedor-destaque">
                <p id="primeiro-destaque"></p>
                <p id="segundo-destaque"></p>
                <p id="terceiro-destaque"></p>
                <p id="quarto-destaque"></p>
            </div>
        </section>

        <section id="premios">
            <h2>Lista de Prêmios</h2>
            <ul id="lista-premios"></ul>
        </section>
    </main>

        <script src="gamificacao.js"></script>
    <script>
        const config = {
            storageKey: "devalor_gamificacao_sdr_v1",
            people: [
                { id: "alana", nome: "Alana" },
                { id: "laura", nome: "Laura" },
                { id: "pedro", nome: "Pedro" },
                { id: "sabrina", nome: "Sabrina" },
            ],
            metrics: [
                { key: "reuniao_agendada", label: "Reunião agendada", type: "number", points: 2 },
                { key: "reuniao_realizada", label: "Reunião realizada", type: "number", points: 4 },
                { key: "sem_faltas", label: "Sem faltas/atrasos", type: "checkbox", points: 1 },
            ],
        };

        const app = Gamificacao.init(config);


        const premios = [
            { id: 1, nome: "1º Lugar: Folga integral dia 01/08/2025 + R$150,00." },
            { id: 2, nome: "2º Lugar: Meio período de folga dia 01/08/2025 + R$100,00" },
        ];

        Gamificacao.renderPremios(premios, "lista-premios");

    </script>
</body>
</html>
